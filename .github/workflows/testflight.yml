# Construit l'app iPhone sur un Mac GitHub, la signe et l'envoie sur TestFlight — sans Xcode local.
# Lancement manuel : Actions → TestFlight iPhone → Run workflow.
# Secrets nécessaires (Settings → Secrets and variables → Actions) :
#   APPLE_TEAM_ID              identifiant d'équipe Apple Developer (10 caractères)
#   APPSTORE_API_KEY_ID        Key ID de la clé API App Store Connect (rôle Admin)
#   APPSTORE_API_ISSUER_ID     Issuer ID affiché au-dessus de la liste des clés
#   APPSTORE_API_KEY_P8        contenu du fichier AuthKey_XXXX.p8 (texte brut ou base64)
name: TestFlight iPhone

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    env:
      AVEC_CLES: ${{ secrets.APPSTORE_API_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Clés App Store Connect présentes ?
        if: env.AVEC_CLES != 'true'
        run: |
          echo "::error::Ajoutez les secrets APPLE_TEAM_ID, APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID et APPSTORE_API_KEY_P8 (voir README)."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios

      - name: Clé API App Store Connect
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        # Accepte le contenu brut du .p8 (« -----BEGIN PRIVATE KEY----- … ») ou sa version base64.
        run: |
          if printf '%s' "$APPSTORE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPSTORE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          else
            printf '%s' "$APPSTORE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          fi

      - name: Archive signée (signature automatique gérée par Apple)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" MARKETING_VERSION=1.0 \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -60
          test "${PIPESTATUS[0]}" -eq 0

      - name: Envoi sur TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -60
          test "${PIPESTATUS[0]}" -eq 0
