# Vérifie que l'app iOS compile (simulateur, sans signature) à chaque modification du projet iOS.
# L'installation sur iPhone et l'envoi sur TestFlight se font depuis Xcode (voir README).
name: App iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/ios.yml"

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # Apple exige le SDK iOS 26 (Xcode 26 ou plus récent) pour TestFlight et l'App Store.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Compilation (simulateur)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
