# Production sur le VPS : application + PostgreSQL + sauvegardes.
# Conçu pour cohabiter avec d'autres applications sur le même serveur :
#  - nom de projet dédié (conteneurs, réseau et volumes préfixés « fretpei »),
#  - aucun port public : l'app écoute sur 127.0.0.1:${APP_PORT} et la base n'est pas exposée,
#  - le HTTPS est assuré par le reverse proxy déjà en place (Nginx, Traefik…), voir README.
# Sur un serveur vierge, ajouter Caddy : docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
# Les secrets sont lus dans le fichier .env à côté de ce fichier (voir .env.example).

name: fretpei

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fretpei:${POSTGRES_PASSWORD}@db:5432/fretpei
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    mem_limit: 1g

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fretpei
      POSTGRES_DB: fretpei
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - donnees:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fretpei"]
      interval: 5s
      retries: 10
    mem_limit: 1g

  # Sauvegarde quotidienne de la base dans ./sauvegardes (14 jours conservés).
  sauvegarde:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./sauvegardes:/sauvegardes
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h db -U fretpei -Fc fretpei > /sauvegardes/fretpei-$$(date +%F).dump
          find /sauvegardes -name '*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  donnees:
