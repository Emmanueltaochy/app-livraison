# À placer dans /etc/nginx/sites-available/ si le VPS utilise déjà Nginx,
# puis : ln -s ../sites-available/fretpei.conf /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# puis : certbot --nginx -d livraison.taochyconsulting.fr   (HTTPS)
server {
    listen 80;
    server_name livraison.taochyconsulting.fr;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}
